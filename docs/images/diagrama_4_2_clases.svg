  <line x1="845" y1="195" x2="1165" y2="195" stroke="#10B981" stroke-width="1.5"/>
  <text x="858" y="154" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">+ PLANS: dict (basico/pro/multi)</text>
  <text x="858" y="174" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">+ COP_PER_USD: int = 4000</text>
  <text x="858" y="218" fill="#86EFAC" font-family="Consolas, monospace" font-size="12.5">+ simulate_payment() Response</text>
