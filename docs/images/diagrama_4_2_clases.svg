<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" rx="18" fill="#0E1B17" stroke="#D9A441" stroke-width="2.5"/>
  <rect x="3" y="3" width="1194" height="62" rx="15" fill="#15271F"/>
  <text x="34" y="34" fill="#D9A441" font-family="Segoe UI, sans-serif" font-size="21" font-weight="900">4.2 DIAGRAMA UML DE CLASES · ARQUITECTURA BACKEND FLASK Y DESKTOP C#</text>
  <text x="34" y="54" fill="#EFE6D2" font-family="Segoe UI, sans-serif" font-size="13.5">Clases, Atributos (-), Métodos (+) y Relaciones de Dependencia / Asociación</text>

  <!-- Connectors -->
  <line x1="370" y1="190" x2="455" y2="190" stroke="#D9A441" stroke-width="2.5"/>
  <line x1="765" y1="190" x2="845" y2="190" stroke="#10B981" stroke-width="2.5"/>
