  <text x="858" y="284" fill="#86EFAC" font-family="Consolas, monospace" font-size="12.5">+ _lifetime_admin_subscription()</text>

  <!-- CLASS 4: Desktop Client C# -->
  <rect x="35" y="395" width="335" height="260" rx="10" fill="#12241D" stroke="#14B8A6" stroke-width="2.2"/>
  <rect x="35" y="395" width="335" height="36" rx="8" fill="#0D9488"/>
  <text x="202" y="419" fill="#FFFFFF" font-family="Consolas, monospace" font-size="15" font-weight="900" text-anchor="middle">BarricaDesktop (C# WinForms)</text>
  <line x1="35" y1="510" x2="370" y2="510" stroke="#14B8A6" stroke-width="1.5"/>
  <text x="48" y="454" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">+ ServerUrl: string</text>
  <text x="48" y="474" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">+ Token / UserRole: string</text>
  <text x="48" y="494" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">+ IsAdmin: bool</text>
  <text x="48" y="534" fill="#5EEAD4" font-family="Consolas, monospace" font-size="12.5">+ SubmitAuth() void</text>
  <text x="48" y="556" fill="#5EEAD4" font-family="Consolas, monospace" font-size="12.5">+ RefreshDashboardAsync() Task</text>
  <text x="48" y="578" fill="#5EEAD4" font-family="Consolas, monospace" font-size="12.5">+ AddOrderToTableAsync() Task</text>
  <text x="48" y="600" fill="#5EEAD4" font-family="Consolas, monospace" font-size="12.5">+ CheckoutTableAsync() Task</text>

  <!-- CLASS 5: BarPosController -->
  <rect x="455" y="395" width="310" height="260" rx="10" fill="#12241D" stroke="#3B82F6" stroke-width="2.2"/>
  <rect x="455" y="395" width="310" height="36" rx="8" fill="#2563EB"/>
  <text x="610" y="419" fill="#FFFFFF" font-family="Consolas, monospace" font-size="15" font-weight="900" text-anchor="middle">BarPosController (REST API)</text>
  <line x1="455" y1="475" x2="765" y2="475" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="468" y="456" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">- DEFAULT_BAR_TABLES / PRODUCTS</text>
  <text x="468" y="502" fill="#93C5FD" font-family="Consolas, monospace" font-size="12.5">+ bar_dashboard() Response</text>
  <text x="468" y="524" fill="#93C5FD" font-family="Consolas, monospace" font-size="12.5">+ create/delete_bar_product()</text>
  <text x="468" y="546" fill="#93C5FD" font-family="Consolas, monospace" font-size="12.5">+ adjust_stock / manage_reserve()</text>
  <text x="468" y="568" fill="#93C5FD" font-family="Consolas, monospace" font-size="12.5">+ add/remove_table_order()</text>
  <text x="468" y="590" fill="#93C5FD" font-family="Consolas, monospace" font-size="12.5">+ checkout_bar_table() Response</text>
  <text x="468" y="612" fill="#93C5FD" font-family="Consolas, monospace" font-size="12.5">+ update_bar_user_role() (Admin)</text>

  <!-- CLASS 6: ShiftAndInvoiceStore -->
  <rect x="845" y="395" width="320" height="260" rx="10" fill="#12241D" stroke="#F59E0B" stroke-width="2.2"/>
  <rect x="845" y="395" width="320" height="36" rx="8" fill="#D97706"/>
