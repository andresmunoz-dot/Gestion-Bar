  <line x1="845" y1="495" x2="1165" y2="495" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="858" y="454" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">- _POS_RUNTIME_STORE: dict</text>
  <text x="858" y="474" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">- _POS_RUNTIME_LOCK: Lock</text>
