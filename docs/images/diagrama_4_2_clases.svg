  <text x="858" y="586" fill="#FDE047" font-family="Consolas, monospace" font-size="12.5">+ _record_ghost_invoice()</text>
  <text x="858" y="608" fill="#FDE047" font-family="Consolas, monospace" font-size="12.5">+ list_ghost_invoices() (Admin)</text>
