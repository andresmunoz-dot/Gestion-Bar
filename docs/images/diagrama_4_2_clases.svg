  <line x1="765" y1="530" x2="845" y2="530" stroke="#F59E0B" stroke-width="2.5"/>

  <!-- CLASS 1: DatabasePool & SQLiteFallback -->
  <rect x="35" y="95" width="335" height="230" rx="10" fill="#12241D" stroke="#A855F7" stroke-width="2.2"/>
  <rect x="35" y="95" width="335" height="36" rx="8" fill="#7E22CE"/>
  <text x="202" y="119" fill="#FFFFFF" font-family="Consolas, monospace" font-size="15" font-weight="900" text-anchor="middle">DatabasePool / SQLiteAdapter</text>
  <line x1="35" y1="205" x2="370" y2="205" stroke="#A855F7" stroke-width="1.5"/>
  <text x="48" y="154" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">- _DB_POOL: MySQLConnectionPool</text>
  <text x="48" y="174" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">- _DB_POOL_LOCK: threading.Lock</text>
  <text x="48" y="194" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">- is_sqlite_fallback: bool</text>
  <text x="48" y="228" fill="#86EFAC" font-family="Consolas, monospace" font-size="12.5">+ get_db_connection() Connection</text>
  <text x="48" y="250" fill="#86EFAC" font-family="Consolas, monospace" font-size="12.5">+ _database_connection() Context</text>
  <text x="48" y="272" fill="#86EFAC" font-family="Consolas, monospace" font-size="12.5">+ _ensure_bar_tables_and_seed()</text>
  <text x="48" y="294" fill="#86EFAC" font-family="Consolas, monospace" font-size="12.5">+ _ensure_sqlite_schema()</text>

  <!-- CLASS 2: AuthService -->
  <rect x="455" y="95" width="310" height="225" rx="10" fill="#12241D" stroke="#D9A441" stroke-width="2.2"/>
  <rect x="455" y="95" width="310" height="36" rx="8" fill="#D9A441"/>
  <text x="610" y="119" fill="#18140E" font-family="Consolas, monospace" font-size="15" font-weight="900" text-anchor="middle">AuthService (app.py)</text>
  <line x1="455" y1="195" x2="765" y2="195" stroke="#D9A441" stroke-width="1.5"/>
  <text x="468" y="154" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">- SESSION_COOKIE: str</text>
  <text x="468" y="174" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">- _ADMIN_DEFAULT_EMAIL: str</text>
  <text x="468" y="218" fill="#FDE047" font-family="Consolas, monospace" font-size="12.5">+ register() Response (201)</text>
  <text x="468" y="240" fill="#FDE047" font-family="Consolas, monospace" font-size="12.5">+ login() Response (200 / 402)</text>
  <text x="468" y="262" fill="#FDE047" font-family="Consolas, monospace" font-size="12.5">+ session() / logout() Response</text>
  <text x="468" y="284" fill="#FDE047" font-family="Consolas, monospace" font-size="12.5">+ _require_bar_user(admin_only)</text>

  <!-- CLASS 3: SubscriptionService -->
  <rect x="845" y="95" width="320" height="225" rx="10" fill="#12241D" stroke="#10B981" stroke-width="2.2"/>
