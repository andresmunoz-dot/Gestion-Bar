<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" rx="18" fill="#0E1B17" stroke="#D9A441" stroke-width="2.5"/>
  <rect x="3" y="3" width="1194" height="64" rx="15" fill="#15271F"/>
  <text x="34" y="34" fill="#D9A441" font-family="Segoe UI, sans-serif" font-size="21" font-weight="900">1. DIAGRAMA ENTIDAD-RELACIÓN (DER) · BASE DE DATOS BARRICA POS (8 ENTIDADES)</text>
  <text x="34" y="55" fill="#EFE6D2" font-family="Segoe UI, sans-serif" font-size="13.5">Notación Crow's Foot (Pata de Gallo) · Llaves Primarias (PK), Foráneas (FK) y Unicidad (UK)</text>

  <!-- Relationship Lines & Diamonds -->
  <!-- USERS (1) ---< (N) SESSIONS -->
  <line x1="310" y1="185" x2="490" y2="185" stroke="#D9A441" stroke-width="3"/>
  <line x1="322" y1="173" x2="322" y2="197" stroke="#D9A441" stroke-width="3"/>
  <line x1="470" y1="185" x2="490" y2="171" stroke="#D9A441" stroke-width="2.5"/>
  <line x1="470" y1="185" x2="490" y2="199" stroke="#D9A441" stroke-width="2.5"/>
  <polygon points="400,162 435,185 400,208 365,185" fill="#15271F" stroke="#D9A441" stroke-width="2"/>
  <text x="400" y="189" fill="#FDE047" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">inicia 1:N</text>

  <!-- USERS (1) ---< (N) SUBSCRIPTIONS -->
  <line x1="175" y1="295" x2="175" y2="415" stroke="#10B981" stroke-width="3"/>
  <line x1="163" y1="308" x2="187" y2="308" stroke="#10B981" stroke-width="3"/>
  <line x1="175" y1="395" x2="161" y2="415" stroke="#10B981" stroke-width="2.5"/>
  <line x1="175" y1="395" x2="189" y2="415" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="175,332 222,355 175,378 128,355" fill="#15271F" stroke="#10B981" stroke-width="2"/>
  <text x="175" y="359" fill="#86EFAC" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">contrata 1:N</text>

  <!-- BAR_TABLES (1) ---< (N) TABLE_ORDERS -->
  <line x1="760" y1="495" x2="555" y2="495" stroke="#8B5CF6" stroke-width="3"/>
  <line x1="748" y1="483" x2="748" y2="507" stroke="#8B5CF6" stroke-width="3"/>
  <line x1="575" y1="495" x2="555" y2="481" stroke="#8B5CF6" stroke-width="2.5"/>
  <line x1="575" y1="495" x2="555" y2="509" stroke="#8B5CF6" stroke-width="2.5"/>
  <polygon points="658,470 706,495 658,520 610,495" fill="#15271F" stroke="#8B5CF6" stroke-width="2"/>
  <text x="658" y="499" fill="#DDD6FE" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800" text-anchor="middle">consume 1:N</text>

  <!-- PRODUCTS (1) ---< (N) TABLE_ORDERS -->
  <line x1="500" y1="365" x2="500" y2="415" stroke="#EC4899" stroke-width="3"/>
  <line x1="760" y1="220" x2="640" y2="415" stroke="#EC4899" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="695,305 745,328 695,351 645,328" fill="#15271F" stroke="#EC4899" stroke-width="2"/>
  <text x="695" y="332" fill="#FBCFE8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800" text-anchor="middle">incluye 1:N</text>

  <!-- ENTITY 1: USERS -->
  <rect x="35" y="95" width="275" height="200" rx="12" fill="#12241D" stroke="#D9A441" stroke-width="2.2"/>
  <rect x="35" y="95" width="275" height="36" rx="10" fill="#D9A441"/>
  <text x="172" y="119" fill="#18140E" font-family="Segoe UI, sans-serif" font-size="15" font-weight="900" text-anchor="middle">USERS (Usuarios)</text>
  <text x="50" y="152" fill="#FDE047" font-family="Consolas, monospace" font-size="13.5" font-weight="700">🔑 PK  id (BIGINT)</text>
  <text x="50" y="176" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    full_name (VARCHAR 120)</text>
  <text x="50" y="200" fill="#86EFAC" font-family="Consolas, monospace" font-size="13" font-weight="700">✦ UK  email (VARCHAR 254)</text>
  <text x="50" y="224" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    password_hash (BCRYPT)</text>
  <text x="50" y="248" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    role (admin / vendedor)</text>
  <text x="50" y="272" fill="#A3AB9D" font-family="Consolas, monospace" font-size="12.5">    created_at (TIMESTAMP)</text>

  <!-- ENTITY 2: SESSIONS -->
  <rect x="490" y="95" width="250" height="185" rx="12" fill="#12241D" stroke="#3B82F6" stroke-width="2.2"/>
  <rect x="490" y="95" width="250" height="36" rx="10" fill="#2563EB"/>
  <text x="615" y="119" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="15" font-weight="900" text-anchor="middle">SESSIONS (Sesiones)</text>
  <text x="505" y="152" fill="#FDE047" font-family="Consolas, monospace" font-size="13.5" font-weight="700">🔑 PK  token_hash (CHAR 64)</text>
  <text x="505" y="176" fill="#93C5FD" font-family="Consolas, monospace" font-size="13.5" font-weight="700">🔗 FK  user_id → USERS.id</text>
  <text x="505" y="200" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    role (VARCHAR 20)</text>
  <text x="505" y="224" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    expires_at (DATETIME)</text>
  <text x="505" y="248" fill="#A3AB9D" font-family="Consolas, monospace" font-size="12.5">    created_at (TIMESTAMP)</text>

  <!-- ENTITY 3: PRODUCTS -->
  <rect x="760" y="95" width="275" height="245" rx="12" fill="#12241D" stroke="#EC4899" stroke-width="2.2"/>
  <rect x="760" y="95" width="275" height="36" rx="10" fill="#DB2777"/>
  <text x="897" y="119" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="15" font-weight="900" text-anchor="middle">PRODUCTS (Inventario)</text>
  <text x="775" y="152" fill="#FDE047" font-family="Consolas, monospace" font-size="13.5" font-weight="700">🔑 PK  id (INT UNSIGNED)</text>
  <text x="775" y="176" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    name (VARCHAR 120)</text>
  <text x="775" y="200" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    category (VARCHAR 60)</text>
  <text x="775" y="224" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    price_cop (INT COP)</text>
  <text x="775" y="248" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    stock / min_stock (INT)</text>
  <text x="775" y="272" fill="#FBCFE8" font-family="Consolas, monospace" font-size="13">    reserve_stock (Bodega)</text>
  <text x="775" y="296" fill="#A3AB9D" font-family="Consolas, monospace" font-size="12.5">    image_url / created_at</text>

  <!-- ENTITY 4: SUBSCRIPTIONS -->
  <rect x="35" y="415" width="275" height="230" rx="12" fill="#12241D" stroke="#10B981" stroke-width="2.2"/>
  <rect x="35" y="415" width="275" height="36" rx="10" fill="#059669"/>
  <text x="172" y="439" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="15" font-weight="900" text-anchor="middle">SUBSCRIPTIONS (Planes)</text>
  <text x="50" y="472" fill="#FDE047" font-family="Consolas, monospace" font-size="13.5" font-weight="700">🔑 PK  id (BIGINT)</text>
  <text x="50" y="496" fill="#93C5FD" font-family="Consolas, monospace" font-size="13.5" font-weight="700">🔗 FK  user_id → USERS.id</text>
  <text x="50" y="520" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    plan_id (basico/pro/multi)</text>
  <text x="50" y="544" fill="#86EFAC" font-family="Consolas, monospace" font-size="13">    status (test/trial_active)</text>
  <text x="50" y="568" fill="#86EFAC" font-family="Consolas, monospace" font-size="13" font-weight="700">✦ UK  payment_reference</text>
  <text x="50" y="592" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    starts_at / expires_at</text>
  <text x="50" y="616" fill="#A3AB9D" font-family="Consolas, monospace" font-size="12.5">    created_at (+30 días)</text>

  <!-- ENTITY 5: TABLE_ORDERS -->
  <rect x="330" y="415" width="245" height="230" rx="12" fill="#12241D" stroke="#8B5CF6" stroke-width="2.2"/>
  <rect x="330" y="415" width="245" height="36" rx="10" fill="#7C3AED"/>
  <text x="452" y="439" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="14.5" font-weight="900" text-anchor="middle">TABLE_ORDERS (Comanda)</text>
  <text x="344" y="472" fill="#FDE047" font-family="Consolas, monospace" font-size="13.5" font-weight="700">🔑 PK  id (BIGINT)</text>
  <text x="344" y="496" fill="#93C5FD" font-family="Consolas, monospace" font-size="13" font-weight="700">🔗 FK  table_id → BAR_TABLES</text>
  <text x="344" y="520" fill="#93C5FD" font-family="Consolas, monospace" font-size="13" font-weight="700">🔗 FK  product_id → PRODUCTS</text>
  <text x="344" y="544" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    product_name (VARCHAR)</text>
  <text x="344" y="568" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    quantity (INT UNSIGNED)</text>
  <text x="344" y="592" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    unit_price_cop (INT)</text>
  <text x="344" y="616" fill="#A3AB9D" font-family="Consolas, monospace" font-size="12.5">    created_at (TIMESTAMP)</text>

  <!-- ENTITY 6: BAR_TABLES -->
  <rect x="760" y="415" width="220" height="190" rx="12" fill="#12241D" stroke="#14B8A6" stroke-width="2.2"/>
  <rect x="760" y="415" width="220" height="36" rx="10" fill="#0D9488"/>
  <text x="870" y="439" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="14.5" font-weight="900" text-anchor="middle">BAR_TABLES (Mesas)</text>
  <text x="774" y="472" fill="#FDE047" font-family="Consolas, monospace" font-size="13.5" font-weight="700">🔑 PK  id (INT)</text>
  <text x="774" y="496" fill="#86EFAC" font-family="Consolas, monospace" font-size="13" font-weight="700">✦ UK  table_number</text>
  <text x="774" y="520" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    label (Zona/Salón)</text>
  <text x="774" y="544" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    capacity (Puestos)</text>
  <text x="774" y="568" fill="#EFE6D2" font-family="Consolas, monospace" font-size="13">    status (libre/ocupada)</text>

  <!-- ENTITY 7: AUTH_ATTEMPTS -->
  <rect x="1050" y="95" width="130" height="195" rx="12" fill="#12241D" stroke="#F59E0B" stroke-width="2"/>
  <rect x="1050" y="95" width="130" height="36" rx="10" fill="#D97706"/>
  <text x="1115" y="118" fill="#18140E" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="900" text-anchor="middle">AUTH_ATTEMPTS</text>
  <text x="1058" y="150" fill="#FDE047" font-family="Consolas, monospace" font-size="11.5" font-weight="700">🔑 key_hash</text>
  <text x="1058" y="176" fill="#EFE6D2" font-family="Consolas, monospace" font-size="11.5">attempts (0..5)</text>
  <text x="1058" y="202" fill="#EFE6D2" font-family="Consolas, monospace" font-size="11">window_started</text>
  <text x="1058" y="228" fill="#EFE6D2" font-family="Consolas, monospace" font-size="11">last_attempt</text>
  <text x="1058" y="264" fill="#FCD34D" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700">Anti-BruteForce</text>

  <!-- ENTITY 8: SALES -->
  <rect x="995" y="415" width="185" height="190" rx="12" fill="#12241D" stroke="#22C55E" stroke-width="2"/>
  <rect x="995" y="415" width="185" height="36" rx="10" fill="#16A34A"/>
  <text x="1087" y="439" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="14" font-weight="900" text-anchor="middle">SALES (Ventas)</text>
  <text x="1008" y="472" fill="#FDE047" font-family="Consolas, monospace" font-size="13" font-weight="700">🔑 PK id (BIGINT)</text>
  <text x="1008" y="496" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">table_label</text>
  <text x="1008" y="520" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">items_summary</text>
  <text x="1008" y="544" fill="#86EFAC" font-family="Consolas, monospace" font-size="12.5" font-weight="700">total_cop (COP)</text>
  <text x="1008" y="568" fill="#EFE6D2" font-family="Consolas, monospace" font-size="12.5">payment_method</text>
  <text x="1008" y="590" fill="#A3AB9D" font-family="Consolas, monospace" font-size="12">created_at (IDX)</text>

  <!-- Legend Footer -->
  <rect x="35" y="662" width="1145" height="42" rx="10" fill="#15271F" stroke="#344A3F"/>
  <text x="55" y="688" fill="#D9A441" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="800">LEYENDA DEL DER:</text>
  <text x="200" y="688" fill="#FDE047" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">🔑 PK = Llave Primaria</text>
  <text x="385" y="688" fill="#93C5FD" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">🔗 FK = Llave Foránea (1:N)</text>
  <text x="610" y="688" fill="#86EFAC" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">✦ UK = Restricción UNIQUE</text>
  <text x="830" y="688" fill="#EFE6D2" font-family="Segoe UI, sans-serif" font-size="13">◇ Rombo = Relación Semántica entre Tablas</text>
</svg>
