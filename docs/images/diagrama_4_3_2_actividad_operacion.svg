<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <rect width="1200" height="540" rx="18" fill="#0E1B17" stroke="#10B981" stroke-width="2.5"/>
  <rect x="3" y="3" width="1194" height="62" rx="15" fill="#15271F"/>
  <text x="34" y="34" fill="#10B981" font-family="Segoe UI, sans-serif" font-size="20" font-weight="900">4.3.2 DIAGRAMA UML DE ACTIVIDADES · TURNO DE CAJA, COMANDA, COBRO Y ARQUEO</text>
  <text x="34" y="54" fill="#EFE6D2" font-family="Segoe UI, sans-serif" font-size="13.5">Ciclo Operativo Completo en el Salón: Apertura de Turno → Toma de Pedido → Factura Fantasma → Cierre Único</text>

  <!-- Row 1 -->
  <circle cx="65" cy="145" r="16" fill="#10B981"/>
  <line x1="81" y1="145" x2="120" y2="145" stroke="#10B981" stroke-width="3"/>

  <rect x="120" y="108" width="245" height="74" rx="12" fill="#15271F" stroke="#10B981" stroke-width="2"/>
  <text x="242" y="138" fill="#86EFAC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" text-anchor="middle">1. Abrir Turno de Caja</text>
  <text x="242" y="160" fill="#EFE6D2" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">Datos del encargado + Base COP</text>

  <line x1="365" y1="145" x2="415" y2="145" stroke="#10B981" stroke-width="3"/>

  <rect x="415" y="108" width="245" height="74" rx="12" fill="#15271F" stroke="#10B981" stroke-width="2"/>
  <text x="537" y="138" fill="#86EFAC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" text-anchor="middle">2. Seleccionar Mesa y</text>
  <text x="537" y="160" fill="#EFE6D2" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">Elegir Producto de la Carta</text>

  <line x1="660" y1="145" x2="720" y2="145" stroke="#10B981" stroke-width="3"/>

  <!-- Decision: Stock >= Quantity? -->
  <polygon points="825,95 930,145 825,195 720,145" fill="#1B3328" stroke="#FDE047" stroke-width="2.2"/>
  <text x="825" y="142" fill="#FDE047" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">¿Stock Barra</text>
  <text x="825" y="159" fill="#EFE6D2" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">&gt;= Cantidad?</text>

  <!-- Reserve transfer box -->
  <line x1="930" y1="145" x2="980" y2="145" stroke="#FCA5A5" stroke-width="2.5"/>
  <text x="955" y="135" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" text-anchor="middle">NO</text>
  <rect x="980" y="108" width="185" height="74" rx="12" fill="#3B1820" stroke="#EC4899" stroke-width="2"/>
  <text x="1072" y="138" fill="#FBCFE8" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle">Trasladar Bodega</text>
  <text x="1072" y="158" fill="#EFE6D2" font-family="Segoe UI, sans-serif" font-size="11.5" text-anchor="middle">reserve_stock → stock</text>

  <!-- Down from Decision YES -->
  <line x1="825" y1="195" x2="825" y2="275" stroke="#10B981" stroke-width="3"/>
  <text x="850" y="238" fill="#86EFAC" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800">SÍ</text>

  <!-- Step 3: Insert table_orders -->
  <rect x="680" y="275" width="290" height="78" rx="12" fill="#15271F" stroke="#8B5CF6" stroke-width="2.2"/>
  <text x="825" y="305" fill="#DDD6FE" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">3. Registrar en table_orders</text>
  <text x="825" y="328" fill="#EFE6D2" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">Descontar products.stock · Mesa OCUPADA</text>

  <line x1="680" y1="314" x2="615" y2="314" stroke="#D9A441" stroke-width="3"/>

  <!-- Step 4: Checkout & Ghost Invoice -->
  <rect x="325" y="275" width="290" height="78" rx="12" fill="#15271F" stroke="#D9A441" stroke-width="2.2"/>
  <text x="470" y="305" fill="#FDE047" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">4. Dividir Cuenta y Cobrar Mesa</text>
  <text x="470" y="328" fill="#EFE6D2" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">Insertar sales · Emitir FAC-FANTASMA · LIBRE</text>

  <line x1="470" y1="353" x2="470" y2="415" stroke="#D9A441" stroke-width="3"/>

  <!-- Step 5: Close Shift Consolidated Receipt -->
  <rect x="255" y="415" width="430" height="84" rx="14" fill="#143825" stroke="#10B981" stroke-width="2.4"/>
  <text x="470" y="447" fill="#86EFAC" font-family="Segoe UI, sans-serif" font-size="15" font-weight="900" text-anchor="middle">5. Cerrar Turno: Emitir CIERRE-TURNO-00001</text>
  <text x="470" y="473" fill="#EFE6D2" font-family="Segoe UI, sans-serif" font-size="12.5" text-anchor="middle">Consolidar productos vendidos, medios de pago y efectivo esperado en caja</text>

  <line x1="685" y1="457" x2="765" y2="457" stroke="#D9A441" stroke-width="3"/>
  <circle cx="785" cy="457" r="16" fill="none" stroke="#D9A441" stroke-width="2.5"/>
  <circle cx="785" cy="457" r="9" fill="#D9A441"/>
</svg>
